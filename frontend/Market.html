<!DOCTYPE html>
<html lang="en" dir="ltr" data-theme="dark">
<head>
<meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>EcoTrade — Market</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Cairo:wght@300;400;500;600;700;800&display=swap" rel="stylesheet"/>
<style>
.main{position:relative;z-index:1;padding-top:84px;padding-bottom:calc(var(--bottom-nav-h,76px)+24px)}
.search-row{display:flex;gap:10px;align-items:center;margin-bottom:20px}
.search-wrap{position:relative;flex:1}
.search-icon{position:absolute;top:50%;transform:translateY(-50%);color:var(--text-secondary);font-size:16px;pointer-events:none}
[dir=ltr] .search-icon{left:14px}[dir=rtl] .search-icon{right:14px}
.search-inp{width:100%;padding:12px 14px 12px 42px;background:var(--glass);border:1px solid var(--glass-border);border-radius:14px;outline:none;font-size:14px;color:var(--text-primary);font-family:inherit;backdrop-filter:blur(12px);transition:border-color .22s,background .22s;caret-color:var(--accent)}
[dir=rtl] .search-inp{padding:12px 42px 12px 14px}
.search-inp::placeholder{color:var(--text-secondary);font-family:inherit}
.search-inp:focus{border-color:rgba(34,211,238,.45);background:var(--glass-strong);box-shadow:0 0 0 3px rgba(34,211,238,.08)}

.cat-scroll{display:flex;gap:10px;overflow-x:auto;padding-bottom:4px;margin-bottom:22px;scrollbar-width:none}
.cat-scroll::-webkit-scrollbar{display:none}
[dir=rtl] .cat-scroll{flex-direction:row-reverse}
.cat-pill{flex-shrink:0;padding:8px 18px;border-radius:999px;cursor:pointer;font-size:13px;font-weight:600;border:1px solid var(--glass-border);background:var(--glass);color:var(--text-secondary);white-space:nowrap;font-family:inherit;transition:all .22s cubic-bezier(.34,1.56,.64,1)}
.cat-pill.active{background:linear-gradient(135deg,var(--accent),var(--accent2));border-color:transparent;color:#020617;font-weight:700;box-shadow:0 4px 16px rgba(34,211,238,.28)}
.cat-pill:not(.active):hover{border-color:var(--accent);color:var(--text-primary)}
.cat-pill:active{transform:scale(.91)}

.prod-grid{display:grid;gap:18px;grid-template-columns:repeat(4,1fr)}
@media(max-width:1100px){.prod-grid{grid-template-columns:repeat(3,1fr)}}
@media(max-width:768px){.prod-grid{grid-template-columns:repeat(2,1fr);gap:13px}}
@media(max-width:380px){.prod-grid{grid-template-columns:1fr 1fr;gap:10px}}

.empty-state{text-align:center;padding:60px 20px;color:var(--text-secondary)}
.empty-icon{font-size:48px;margin-bottom:12px}
.empty-text{font-size:14px;font-weight:600}

.skeleton{background:var(--glass);border:1px solid var(--glass-border);border-radius:20px;aspect-ratio:.85;animation:shimmer 1.4s ease-in-out infinite}
@keyframes shimmer{0%,100%{opacity:.5}50%{opacity:1}}

/* PRODUCT DETAIL OVERLAY */
.overlay{position:fixed;inset:0;z-index:800;background:rgba(2,6,23,.85);backdrop-filter:blur(12px);display:flex;align-items:flex-end;justify-content:center;opacity:0;pointer-events:none;transition:opacity .3s ease}
@media(min-width:600px){.overlay{align-items:center}}
.overlay.open{opacity:1;pointer-events:all}
.detail-card{background:var(--card-bg);border:1px solid var(--glass-border);border-radius:28px 28px 0 0;width:100%;max-width:560px;max-height:90vh;overflow-y:auto;padding:28px 24px 32px;transform:translateY(100%);transition:transform .38s cubic-bezier(.34,1.56,.64,1);scrollbar-width:none}
@media(min-width:600px){.detail-card{border-radius:28px;max-height:85vh;transform:scale(.92) translateY(20px)}}
.overlay.open .detail-card{transform:translateY(0)}
@media(min-width:600px){.overlay.open .detail-card{transform:scale(1) translateY(0)}}
.detail-card::-webkit-scrollbar{display:none}
.detail-img{width:100%;height:220px;object-fit:cover;border-radius:18px;margin-bottom:20px}
.detail-name{font-size:22px;font-weight:800;letter-spacing:-.02em;margin-bottom:6px}
.detail-cat{font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--accent);margin-bottom:10px}
.detail-desc{font-size:14px;color:var(--text-secondary);line-height:1.7;margin-bottom:18px}
.detail-price{font-size:28px;font-weight:800;color:var(--accent);letter-spacing:-.04em;margin-bottom:22px}
.detail-actions{display:flex;gap:12px;flex-wrap:wrap}
.seller-row{display:flex;align-items:center;gap:12px;margin-bottom:18px;padding:14px 16px;background:var(--glass);border:1px solid var(--glass-border);border-radius:14px}
.seller-av{width:38px;height:38px;border-radius:50%;background:linear-gradient(135deg,var(--accent),var(--accent2));display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:800;color:#020617;flex-shrink:0}

/* CHECKOUT MODAL */
.checkout-overlay{position:fixed;inset:0;z-index:900;background:rgba(2,6,23,.90);backdrop-filter:blur(14px);display:flex;align-items:center;justify-content:center;opacity:0;pointer-events:none;transition:opacity .3s}
.checkout-overlay.open{opacity:1;pointer-events:all}
.checkout-card{background:var(--card-bg);border:1px solid var(--glass-border);border-radius:28px;width:100%;max-width:480px;padding:32px 28px;transform:scale(.92);transition:transform .38s cubic-bezier(.34,1.56,.64,1);max-height:90vh;overflow-y:auto}
.checkout-overlay.open .checkout-card{transform:scale(1)}
.co-title{font-size:20px;font-weight:800;margin-bottom:24px}
.co-row{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--glass-border);font-size:14px}
.co-row:last-of-type{border-bottom:none;font-weight:800;font-size:16px;color:var(--accent)}
.co-input{width:100%;padding:11px 14px;background:var(--glass);border:1px solid var(--glass-border);border-radius:12px;outline:none;font-size:14px;color:var(--text-primary);font-family:inherit;margin-bottom:10px;caret-color:var(--accent)}
.co-input::placeholder{color:var(--text-secondary);font-family:inherit}
.co-input:focus{border-color:rgba(34,211,238,.45)}
.co-label{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--text-secondary);margin-bottom:10px;margin-top:14px;display:block}
</style>
</head>
<body>
<div class="bg-mesh"></div>
<div class="main">
  <div style="max-width:1280px;margin:0 auto;padding:0 20px">

    <div style="margin-bottom:20px">
      <div class="page-title" data-t="market">Market</div>
      <div style="font-size:13px;color:var(--text-secondary);margin-top:4px">Discover premium eco-certified tools</div>
    </div>

    <!-- SEARCH -->
    <div class="search-row">
      <div class="search-wrap">
        <span class="search-icon">🔍</span>
        <input class="search-inp" id="searchInp" data-tp="search" placeholder="Search products…"/>
      </div>
      <button class="btn-grad" style="padding:12px 20px;font-size:13px;white-space:nowrap" onclick="window.location.href='add.html'">+ Add</button>

    <!-- CATEGORIES -->
    <div class="cat-scroll" id="catScroll">
      <button class="cat-pill active" data-cat="all" data-t="all">All</button>

      <button class="cat-pill" data-cat="machines" data-t="machines">⚙️ Machines</button>
      <button class="cat-pill" data-cat="eco" data-t="eco">🌿 Eco</button>
      <button class="cat-pill" data-cat="electrical" data-t="electrical">⚡ Electrical</button>
      <button class="cat-pill" data-cat="garden" data-t="garden">🌱 Garden</button>
    </div>

    <!-- GRID -->
    <div class="prod-grid" id="prodGrid">

</div>

<!-- PRODUCT DETAIL OVERLAY -->
<div class="overlay" id="detailOverlay" onclick="closeDetail(event)">
  <div class="detail-card" id="detailCard">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px">

      <button class="icon-btn" onclick="closeDetail()">✕</button>
    </div>
    <img class="detail-img" id="detailImg" src="" alt=""/>
    <div class="detail-cat" id="detailCat"></div>
    <div class="detail-name" id="detailName"></div>
    <div class="detail-desc" id="detailDesc"></div>
    <div class="detail-price" id="detailPrice"></div>
    <div class="seller-row" id="sellerRow">
      <div class="seller-av" id="sellerAv">S</div>
      <div><div style="font-size:13px;font-weight:700" id="sellerName">Seller</div><div style="font-size:11px;color:var(--text-secondary)" id="sellerSub">Listed seller</div></div>
      <button class="btn-grad" style="padding:8px 16px;font-size:12px;margin-inline-start:auto" id="msgSellerBtn">💬 Message</button>
    </div>
    <div class="detail-actions" id="detailActions">
      <button class="btn-grad" style="flex:1" id="buyBtn" data-t="buy">Buy Now</button>
      <button class="btn-outline" id="favDetailBtn">🤍 <span data-t="add_to_fav">Add to favorites</span></button>
    </div>

</div>

<!-- CHECKOUT OVERLAY -->
<div class="checkout-overlay" id="coOverlay" onclick="closeCheckout(event)">
  <div class="checkout-card" onclick="event.stopPropagation()">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:4px">
      <div class="co-title" data-t="checkout_title">Complete Purchase</div>
      <button class="icon-btn" onclick="closeCheckout()">✕</button>
    </div>
    <div id="coItems"></div>
    <label class="co-label" data-t="delivery_info">Delivery Information</label>
    <input class="co-input" id="coName" data-tp="name_on_card" placeholder="Name"/>
    <input class="co-input" id="coAddr" data-tp="address" placeholder="Address"/>
    <input class="co-input" id="coCity" data-tp="city" placeholder="City"/>
    <div style="height:16px"></div>
    <button class="btn-grad" style="width:100%;padding:14px" id="payBtn" data-t="pay_now" onclick="confirmOrder()">Confirm &amp; Pay</button>
    <button class="btn-outline" style="width:100%;margin-top:10px;justify-content:center" onclick="closeCheckout()">Cancel</button>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>

<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-storage.js"></script>
<script src="firebase.js"></script>
<script>
const STATIC_PRODS = [
  {id:'s1',name:'Eco Hammer Set',nameAr:'طقم مطرقة بيئي',description:'Professional eco-certified hammer set, 5 pieces.',sub:'Hand Tools',category:'tools',price:34,eco:true,img:'https://images.unsplash.com/photo-1504148455328-c376907d081c?w=500&q=80',imageUrl:'https://images.unsplash.com/photo-1504148455328-c376907d081c?w=500&q=80'},
  {id:'s2',name:'Solar Chainsaw',nameAr:'منشار شجر شمسي',description:'Zero-emission solar powered chainsaw.',sub:'Machines',category:'machines',price:299,eco:true,img:'https://images.unsplash.com/photo-1621905251189-08b45d6a269e?w=500&q=80',imageUrl:'https://images.unsplash.com/photo-1621905251189-08b45d6a269e?w=500&q=80'},
  {id:'s3',name:'Angle Grinder Pro',nameAr:'جلاخة احترافية',description:'Heavy-duty angle grinder, 7.5A motor.',sub:'Power Tools',category:'electrical',price:89,eco:false,img:'https://images.unsplash.com/photo-1572981779307-38b8cabb2407?w=500&q=80',imageUrl:'https://images.unsplash.com/photo-1572981779307-38b8cabb2407?w=500&q=80'},
  {id:'s4',name:'Compost Turner',nameAr:'محول السماد',description:'Effortless compost turning for home gardens.',sub:'Garden',category:'garden',price:56,eco:true,img:'https://images.unsplash.com/photo-1416879595882-3373a0480b5b?w=500&q=80',imageUrl:'https://images.unsplash.com/photo-1416879595882-3373a0480b5b?w=500&q=80'},
  {id:'s5',name:'Laser Level Kit',nameAr:'طقم ميزان ليزر',description:'Self-leveling laser level with case.',sub:'Measuring',category:'tools',price:120,eco:false,img:'https://images.unsplash.com/photo-1581092918056-0c4c3acd3789?w=500&q=80',imageUrl:'https://images.unsplash.com/photo-1581092918056-0c4c3acd3789?w=500&q=80'},
  {id:'s6',name:'Eco Leaf Blower',nameAr:'منفاخ أوراق بيئي',description:'Cordless eco-certified leaf blower.',sub:'Garden',category:'eco',price:74,eco:true,img:'https://images.unsplash.com/photo-1558618666-fcd25c85cd64?w=500&q=80',imageUrl:'https://images.unsplash.com/photo-1558618666-fcd25c85cd64?w=500&q=80'},
  {id:'s7',name:'Cordless Jigsaw',nameAr:'منشار نجاري لاسلكي',description:'Professional 18V cordless jigsaw.',sub:'Power Tools',category:'electrical',price:145,eco:false,img:'https://images.unsplash.com/photo-1581092160562-40aa08e78837?w=500&q=80',imageUrl:'https://images.unsplash.com/photo-1581092160562-40aa08e78837?w=500&q=80'},
  {id:'s8',name:'Solar Water Pump',nameAr:'مضخة مياه شمسية',description:'Solar-powered water pump for gardens.',sub:'Machines',category:'machines',price:220,eco:true,img:'https://images.unsplash.com/photo-1548438294-1ad5d5f4f063?w=500&q=80',imageUrl:'https://images.unsplash.com/photo-1548438294-1ad5d5f4f063?w=500&q=80'},
];

let allProducts = [...STATIC_PRODS];
let favorites   = new Set();
let currentCat  = 'all';
let searchQuery = '';
let currentUser = null;
let currentProduct = null;

// ─── Real-time listener (onSnapshot) replaces getDocs ───────────
// Every time any user adds / edits / deletes a product the grid
// refreshes automatically for ALL open clients.
let unsubProducts = null;
function loadFSProducts() {
  // Unsubscribe any previous listener to avoid duplicates
  if (unsubProducts) { unsubProducts(); unsubProducts = null; }

  unsubProducts = db.collection('products')
    .orderBy('createdAt', 'desc')
    .onSnapshot(snap => {
      // Merge Firestore docs with static demo products (Firestore takes priority)
      const fsProds = snap.docs.map(d => ({
        id: d.id,
        ...d.data(),
        img: d.data().imageUrl || d.data().img || ''
      }));
      // Keep static items that have NO matching Firestore id
      const staticFallback = STATIC_PRODS.filter(
        s => !fsProds.some(f => f.id === s.id)
      );
      allProducts = [...fsProds, ...staticFallback];
      renderGrid();
    }, err => {
      // On permission error (not logged in) fall back to static list
      console.warn('Firestore onSnapshot error:', err.code);
      allProducts = [...STATIC_PRODS];
      renderGrid();
    });
}

function loadFavorites(uid) {
  db.collection('favorites').doc(uid).get().then(snap=>{
    if (snap.exists) {
      favorites = new Set(snap.data().items||[]);
      renderGrid();
    }
  }).catch(()=>{});
}

function saveFavorites(uid) {
  db.collection('favorites').doc(uid).set({items:[...favorites]}).catch(()=>{});
}

function filtered() {
  let list = allProducts;
  if (currentCat !== 'all') list = list.filter(p=>(p.category||p.cat||'')===currentCat);
  if (searchQuery) list = list.filter(p=>(p.name||'').toLowerCase().includes(searchQuery)||(p.nameAr||'').includes(searchQuery));
  return list;
}

// ── ?new=1 param: show banner when coming from add.html ──────────
const _isNewProduct = new URLSearchParams(window.location.search).get('new') === '1';
if (_isNewProduct) {
  // Remove the param from URL cleanly (no page reload)
  history.replaceState(null, '', 'market.html');
}

function renderGrid() {
  const grid = document.getElementById('prodGrid');
  const list = filtered();
  if (!list.length) {
    grid.innerHTML=`<div class="empty-state" style="grid-column:1/-1"><div class="empty-icon">🔍</div><div class="empty-text" data-t="no_products">No products found.</div></div>`;
    applyTranslations(); return;
  }
  grid.innerHTML='';

  list.forEach((p,i)=>{
    const lang  = getLang();
    const name  = lang==='ar'?(p.nameAr||p.name):p.name;
    const isFav = favorites.has(p.id);

    // ── Highlight the newest product when coming from add.html ───
    // The first item in the list is the most recently added (onSnapshot
    // orders by createdAt desc). We give it a green ring for 4 seconds.
    const isNewest = _isNewProduct && i === 0;

    const el = document.createElement('div');
    el.className = 'product-card';

    // Add a subtle "NEW" badge and green glow on the freshly-added card
    if (isNewest) {
      el.style.cssText = 'border-color:rgba(34,197,94,.55)!important;box-shadow:0 0 0 2px rgba(34,197,94,.30),0 12px 40px rgba(0,0,0,.28)';
      setTimeout(() => {
        el.style.cssText = '';   // fade the highlight after 4 s
      }, 4000);
    }

    el.innerHTML = `
      <div class="pc-img-wrap">
        <img class="pc-img" src="${p.img||p.imageUrl||'https://images.unsplash.com/photo-1581092918056-0c4c3acd3789?w=400&q=80'}" alt="${escHtml(name)}" loading="lazy"/>
        <button class="pc-fav" data-id="${p.id}">${isFav?'❤️':'🤍'}</button>
        ${isNewest ? '<div style="position:absolute;top:10px;left:10px;background:#22c55e;color:#fff;font-size:9px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;padding:3px 10px;border-radius:999px;z-index:3">✦ NEW</div>' : ''}
      </div>
      <div class="pc-body">
        <div class="pc-name">${escHtml(name)}</div>
        <div class="pc-sub">${escHtml(p.category||p.sub||p.cat||'')}</div>
        <div class="pc-footer">
          <div class="pc-price">$${String(p.price||0).replace('$','')}</div>
          ${p.eco?`<div class="pc-eco">🌿 Eco</div>`:''}
        </div>
      </div>`;

    el.querySelector('.pc-fav').addEventListener('click', e=>{
      e.stopPropagation();
      const btn=e.currentTarget, id=p.id;
      if(favorites.has(id)){favorites.delete(id);btn.textContent='🤍';}
      else{favorites.add(id);btn.textContent='❤️';btn.style.transform='scale(1.5)';setTimeout(()=>btn.style.transform='',250);}
      if(currentUser) saveFavorites(currentUser.uid);
      showToast(favorites.has(id)?'Added to favorites ❤️':'Removed from favorites');
    });
    el.addEventListener('click', ()=>openDetail(p));
    el.style.opacity='0'; el.style.transform='translateY(14px)';
    addRipple(el); grid.appendChild(el);
    setTimeout(()=>{
      el.style.transition='opacity .35s ease,transform .35s cubic-bezier(.34,1.56,.64,1)';
      el.style.opacity='1'; el.style.transform='translateY(0)';
    }, i*50);
  });

  // Show welcome-back toast once when redirected from add.html
  if (_isNewProduct && list.length) {
    setTimeout(() => showToast('✅ منتجك ظهر في السوق! 🎉', 3000), 600);
  }
}

// categories
document.getElementById('catScroll').addEventListener('click', e=>{
  const pill=e.target.closest('.cat-pill');if(!pill)return;
  document.querySelectorAll('.cat-pill').forEach(p=>p.classList.remove('active'));
  pill.classList.add('active'); currentCat=pill.dataset.cat; renderGrid();
});

// search
document.getElementById('searchInp').addEventListener('input', e=>{
  searchQuery=e.target.value.trim().toLowerCase(); renderGrid();
});

// DETAIL OVERLAY
function openDetail(p) {
  currentProduct = p;
  const lang = getLang();
  const name = lang==='ar'?(p.nameAr||p.name):p.name;
  document.getElementById('detailImg').src = p.img||p.imageUrl||'';
  document.getElementById('detailCat').textContent = p.category||p.sub||p.cat||'';
  document.getElementById('detailName').textContent = name;
  document.getElementById('detailDesc').textContent = p.description||'Quality eco-certified product.';
  document.getElementById('detailPrice').textContent = '$'+(p.price||0);
  const isFav = favorites.has(p.id);
  const fb = document.getElementById('favDetailBtn');
  fb.innerHTML = (isFav?'❤️':'🤍')+' <span>'+(isFav?tr('remove_fav'):tr('add_to_fav'))+'</span>';
  // ── market.html  ·  Seller Row + Chat Redirect ───────────────────
  // Priority order for owner UID: ownerId → createdBy → sellerId
  const sellerId   = p.ownerId   || p.createdBy || p.sellerId || null;
  const sellerName = p.ownerName || p.sellerName || 'EcoTrade Seller';

  // Pre-fill with data already on the product doc (zero extra reads)
  document.getElementById('sellerName').textContent = sellerName;
  document.getElementById('sellerAv').textContent   = avatarLetter(sellerName);
  document.getElementById('sellerSub').textContent  = 'Listed seller';

  if (sellerId) {
    // Enrich seller row from Firestore (photo, online status)
    db.collection('users').doc(sellerId).get().then(snap => {
      if (!snap.exists) return;
      const u = snap.data();
      document.getElementById('sellerName').textContent =
        u.username || u.displayName || u.email || sellerName;
      document.getElementById('sellerAv').textContent =
        avatarLetter(u.username || u.displayName || u.email);
      document.getElementById('sellerSub').textContent =
        u.online ? '🟢 Online' : 'Last seen recently';
      if (u.photoURL) {
        document.getElementById('sellerAv').innerHTML =
          `<img src="${escHtml(u.photoURL)}"
               style="width:100%;height:100%;object-fit:cover;border-radius:50%"
               alt=""/>`;
      }
    }).catch(() => {});

    // ✅  Message → chat.html?receiverId=OWNER_UID
    document.getElementById('msgSellerBtn').onclick = () => {
      if (!currentUser) { window.location.href = 'login.html'; return; }
      if (sellerId === currentUser.uid) {
        showToast("That's your own listing! 😄"); return;
      }
      closeDetail();
      window.location.href = `chat.html?receiverId=${encodeURIComponent(sellerId)}`;
    };
  } else {
    document.getElementById('sellerName').textContent = 'EcoTrade Seller';
    document.getElementById('sellerSub').textContent  = 'Verified seller';
    document.getElementById('msgSellerBtn').onclick = () => {
      if (!currentUser) { window.location.href = 'login.html'; return; }
      showToast('💬 Contact seller via the Chat page');
    };
  }
  document.getElementById('detailOverlay').classList.add('open');
}

function closeDetail(e) {
  if (e && e.target !== document.getElementById('detailOverlay')) return;
  document.getElementById('detailOverlay').classList.remove('open');
}

document.getElementById('buyBtn').addEventListener('click', ()=>{
  if (!currentUser) { window.location.href='login.html'; return; }
  openCheckout(currentProduct);
});
document.getElementById('favDetailBtn').addEventListener('click', ()=>{
  if (!currentProduct) return;
  const id=currentProduct.id;
  if(favorites.has(id)){favorites.delete(id);}else{favorites.add(id);}
  if(currentUser) saveFavorites(currentUser.uid);
  const isFav=favorites.has(id);
  document.getElementById('favDetailBtn').innerHTML=(isFav?'❤️':'🤍')+' <span>'+(isFav?tr('remove_fav'):tr('add_to_fav'))+'</span>';
  showToast(isFav?'Added to favorites ❤️':'Removed from favorites');
});

// CHECKOUT
function openCheckout(p) {
  if (!p) return;
  const name=getLang()==='ar'?(p.nameAr||p.name):p.name;
  const price=+(p.price||0);
  const ship=5;
  document.getElementById('coItems').innerHTML=`
    <div class="co-row"><span>${escHtml(name)}</span><span>$${price.toFixed(2)}</span></div>
    <div class="co-row"><span data-t="shipping">Shipping</span><span>$${ship.toFixed(2)}</span></div>
    <div class="co-row"><span data-t="total">Total</span><span>$${(price+ship).toFixed(2)}</span></div>`;
  applyTranslations();
  document.getElementById('coOverlay').classList.add('open');
}
function closeCheckout(e) {
  if (e && e.target !== document.getElementById('coOverlay')) return;
  document.getElementById('coOverlay').classList.remove('open');
}
function confirmOrder() {
  // ── Validate delivery fields ──────────────────────────────────
  const name = document.getElementById('coName').value.trim();
  const addr = document.getElementById('coAddr').value.trim();
  if (!name || !addr) { showToast('⚠️ Please fill in your name and address.'); return; }
  if (!currentProduct)  { showToast('No product selected.'); return; }

  // ── Build cart item from currentProduct ───────────────────────
  const p         = currentProduct;
  const lang      = getLang();
  const itemName  = lang === 'ar' ? (p.nameAr || p.name) : p.name;
  const itemPrice = parseFloat(String(p.price || 0).replace('$', ''));
  const itemImg   = p.imageUrl || p.img || '';
  const itemId    = p.id || ('prod_' + Date.now());

  // ── Read existing eco_cart from localStorage ──────────────────
  let cart = [];
  try { cart = JSON.parse(localStorage.getItem('eco_cart') || '[]'); } catch { cart = []; }

  // ── If product already in cart → increase quantity ─────────────
  const existing = cart.find(i => i.id === itemId);
  if (existing) {
    existing.quantity = (existing.quantity || 1) + 1;
  } else {
    cart.push({
      id:       itemId,
      name:     itemName,
      nameAr:   p.nameAr  || p.name || '',
      price:    itemPrice,
      image:    itemImg,
      category: p.category || p.cat || '',
      quantity: 1,
    });
  }

  // ── Persist to localStorage ────────────────────────────────────
  localStorage.setItem('eco_cart', JSON.stringify(cart));

  // ── UX: brief loading state then redirect ─────────────────────
  const btn = document.getElementById('payBtn');
  btn.textContent = 'Adding to cart…'; btn.disabled = true;

  showToast('🛒 Added to cart!');

  setTimeout(() => {
    // Close modals cleanly before leaving
    document.getElementById('coOverlay').classList.remove('open');
    document.getElementById('detailOverlay').classList.remove('open');
    // Navigate to cart page
    window.location.href = 'cart.html';
  }, 700);
}

// handle ?product= url param
const urlParams = new URLSearchParams(window.location.search);
const prodParam = urlParams.get('product');

auth.onAuthStateChanged(user => {
  currentUser = user;
  if (user) {
    setupPresence(user.uid);
    loadFavorites(user.uid);
  } else {
    // Not logged in — unsubscribe real-time listener and use static data
    if (unsubProducts) { unsubProducts(); unsubProducts = null; }
    allProducts = [...STATIC_PRODS];
    renderGrid();
  }
  // Start (or restart) real-time listener in both cases
  loadFSProducts();
  // Open detail if product id is in the URL
  if (prodParam) {
    const p = allProducts.find(x => x.id === prodParam);
    if (p) openDetail(p);
  }
});

buildPageHeader({});
buildBottomNav('market');
applyTranslations();
</script>
