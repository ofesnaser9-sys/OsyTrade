<!DOCTYPE html>
<html lang="en" dir="ltr" data-theme="dark">
<head>
<meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>EcoTrade — Login</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Cairo:wght@300;400;500;600;700;800&display=swap" rel="stylesheet"/>
<style>
.auth-page{position:relative;z-index:1;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:80px 20px 30px}
.auth-card{width:100%;max-width:420px;background:var(--card-bg);border:1px solid var(--glass-border);border-radius:28px;padding:36px 30px;backdrop-filter:blur(28px) saturate(170%);-webkit-backdrop-filter:blur(28px) saturate(170%);box-shadow:0 32px 80px rgba(0,0,0,.35);animation:cardIn .5s cubic-bezier(.34,1.56,.64,1) both}
@keyframes cardIn{from{opacity:0;transform:translateY(24px) scale(.97)}to{opacity:1;transform:translateY(0) scale(1)}}
.auth-logo{text-align:center;font-size:28px;font-weight:800;letter-spacing:-.04em;background:linear-gradient(135deg,var(--accent),var(--accent2));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;margin-bottom:6px}
.auth-sub{text-align:center;font-size:14px;color:var(--text-secondary);margin-bottom:28px}
.field{margin-bottom:15px}
.field label{display:block;font-size:11px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--text-secondary);margin-bottom:7px}
.divider{display:flex;align-items:center;gap:12px;margin:18px 0}
.divider::before,.divider::after{content:'';flex:1;height:1px;background:var(--glass-border)}
.divider span{font-size:12px;color:var(--text-secondary);font-weight:600}
.social-btn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;padding:12px;border-radius:14px;border:1px solid var(--glass-border);cursor:pointer;font-size:14px;font-weight:600;font-family:inherit;background:var(--glass);color:var(--text-primary);transition:all .22s;margin-bottom:10px}
.social-btn:hover{border-color:var(--accent);background:var(--glass-strong)}
.social-btn:active{transform:scale(.95)}
.social-icon{width:20px;height:20px;flex-shrink:0}
.err{background:rgba(239,68,68,.14);border:1px solid rgba(239,68,68,.28);border-radius:12px;padding:11px 15px;font-size:13px;color:#fca5a5;margin-bottom:14px;display:none}
.auth-footer{text-align:center;margin-top:18px;font-size:13px;color:var(--text-secondary)}
.auth-link{color:var(--accent);font-weight:700;text-decoration:none;cursor:pointer}
.auth-link:hover{text-decoration:underline}
.forgot{font-size:12px;color:var(--text-secondary);cursor:pointer;float:right;margin-top:4px;transition:color .2s}
.forgot:hover{color:var(--accent)}
[dir=rtl] .forgot{float:left}
.mini-header{position:fixed;top:0;left:0;right:0;z-index:100;background:var(--nav-bg);border-bottom:1px solid var(--glass-border);backdrop-filter:blur(28px);-webkit-backdrop-filter:blur(28px);transition:background .4s}
.mh{max-width:1280px;margin:0 auto;padding:0 20px;height:58px;display:flex;align-items:center;justify-content:space-between}
[dir=rtl] .mh{flex-direction:row-reverse}
</style>
</head>
<body>
<div class="bg-mesh"></div>
<div class="mini-header">
  <div class="mh">
    <a href="home.html" class="logo-text">OSYTRADE</a>
    <div style="display:flex;gap:8px">
      <button class="icon-btn" onclick="toggleLang()">🌐</button>
      <button class="icon-btn" data-theme-icon onclick="toggleTheme()">☀️</button>
    </div>
  </div>
</div>

<div class="auth-page">
  <div class="auth-card">
    <div class="auth-logo">OSYTRADE</div>
    <div class="auth-sub" data-t="sign_in">Sign In</div>
    <div class="err" id="errBanner"></div>

    <div class="field">
      <label data-t="email">Email address</label>
      <input class="form-input" type="email" id="emailInp" data-tp="email" placeholder="Email address" autocomplete="email"/>
    </div>
    <div class="field">
      <label data-t="password">Password</label>
      <input class="form-input" type="password" id="pwInp" data-tp="password" placeholder="Password" autocomplete="current-password"/>
      <span class="forgot" id="forgotBtn" data-t="forgot">Forgot password?</span>
    </div>

    <button class="btn-grad" style="width:100%;padding:14px;font-size:15px;margin-top:4px" id="loginBtn" data-t="sign_in">Sign In</button>

    <div class="divider"><span data-t="or">or</span></div>

    <button class="social-btn" id="googleBtn">
      <svg class="social-icon" viewBox="0 0 24 24"><path fill="#EA4335" d="M5.266 9.765A7.077 7.077 0 0112 4.909c1.69 0 3.218.6 4.418 1.582L19.91 3C17.782 1.145 15.055 0 12 0 7.27 0 3.198 2.698 1.24 6.65l4.026 3.115z"/><path fill="#34A853" d="M16.04 18.013c-1.09.703-2.474 1.078-4.04 1.078a7.077 7.077 0 01-6.723-4.823l-4.04 3.067A11.965 11.965 0 0012 24c2.933 0 5.735-1.043 7.834-3l-3.793-2.987z"/><path fill="#4A90E2" d="M19.834 21c2.195-2.048 3.62-5.096 3.62-9 0-.71-.109-1.473-.272-2.182H12v4.637h6.436c-.317 1.559-1.17 2.766-2.395 3.558L19.834 21z"/><path fill="#FBBC05" d="M5.277 14.268A7.12 7.12 0 014.909 12c0-.782.125-1.533.357-2.235L1.24 6.65A11.934 11.934 0 000 12c0 1.92.445 3.73 1.237 5.335l4.04-3.067z"/></svg>
      <span data-t="sign_in_google">Continue with Google</span>
    </button>
    <button class="social-btn" id="guestBtn">
      <span style="font-size:20px">👤</span>
      <span data-t="sign_in_guest">Continue as Guest</span>
    </button>

    <p class="auth-footer">
      <span data-t="no_account">Don't have an account?</span>&nbsp;
      <a href="register.html" class="auth-link" data-t="register">Register</a>
    </p>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-storage.js"></script>
<script src="firebase.js"></script>
<script>
redirectIfLoggedIn('home.html');

// ── login.html  ·  Authentication Functions ───────────────────────

const err = document.getElementById('errBanner');
function showErr(m)  { err.textContent = m; err.style.display = 'block'; }
function hideErr()   { err.style.display = 'none'; }
function setLoad(btn, loading, label = '') {
  btn.disabled = loading; btn.style.opacity = loading ? '.6' : '1';
  if (label) btn.textContent = loading ? tr('loading') : label;
}

/** Shared redirect after any successful sign-in */
async function afterSignIn(user) {
  setupPresence(user.uid);
  window.location.href = 'home.html';
}

// ── 1. Email / Password sign-in ──────────────────────────────────
document.getElementById('loginBtn').addEventListener('click', async () => {
  hideErr();
  const email = document.getElementById('emailInp').value.trim();
  const pw    = document.getElementById('pwInp').value;
  if (!email || !pw) { showErr('Please fill in all fields.'); return; }
  const btn = document.getElementById('loginBtn');
  setLoad(btn, true, tr('sign_in'));
  try {
    const cred = await auth.signInWithEmailAndPassword(email, pw);
    await upsertUserDoc(cred.user);   // updates presence + email/photo
    await afterSignIn(cred.user);
  } catch (e) {
    showErr(e.message); setLoad(btn, false, tr('sign_in'));
  }
});

document.getElementById('pwInp').addEventListener('keydown', e => {
  if (e.key === 'Enter') document.getElementById('loginBtn').click();
});

// ── 2. Google Sign-In ────────────────────────────────────────────
// Uses saveGoogleUser (firebase.js) which persists displayName,
// photoURL, email and provider = 'google.com' to Firestore.
document.getElementById('googleBtn').addEventListener('click', async () => {
  hideErr();
  const btn = document.getElementById('googleBtn');
  setLoad(btn, true, 'Google…');
  try {
    const provider = new firebase.auth.GoogleAuthProvider();
    // Request profile scope so we always get name + photo
    provider.addScope('profile');
    provider.addScope('email');
    const credential = await auth.signInWithPopup(provider);

    // ✅ saveGoogleUser writes: uid, email, displayName, photoURL, provider
    await saveGoogleUser(credential);
    await afterSignIn(credential.user);
  } catch (e) {
    setLoad(btn, false, tr('sign_in_google'));
    if (e.code !== 'auth/popup-closed-by-user') showErr(e.message);
  }
});

// ── 3. Guest / Anonymous sign-in ────────────────────────────────
document.getElementById('guestBtn').addEventListener('click', async () => {
  hideErr();
  const btn = document.getElementById('guestBtn');
  setLoad(btn, true, 'Guest');
  try {
    const cred = await auth.signInAnonymously();
    await upsertUserDoc(cred.user, {
      username: 'Guest_' + Math.floor(Math.random() * 9000 + 1000)
    });
    await afterSignIn(cred.user);
  } catch (e) {
    showErr(e.message); setLoad(btn, false, tr('sign_in_guest'));
  }
});

// ── 4. Forgot password ───────────────────────────────────────────
document.getElementById('forgotBtn').addEventListener('click', async () => {
  const email = document.getElementById('emailInp').value.trim();
  if (!email) { showErr('Enter your email address first.'); return; }
  try {
    await auth.sendPasswordResetEmail(email);
    showToast('✉️ Reset email sent! Check your inbox.');
  } catch (e) { showErr(e.message); }
});

[document.getElementById('loginBtn'),
 document.getElementById('googleBtn'),
 document.getElementById('guestBtn')
].forEach(addRipple);
</script>
</body>
</html>
